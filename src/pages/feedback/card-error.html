---
title: 카드 오류 제보
description: 카드 설명이나 기업 사례에 잘못된 정보, 오탈자, 오래된 내용이 있다면 알려주세요.
nav: feedback
---
<section class="page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="{{root}}feedback/index.html">피드백</a> › 카드 오류 제보</p>
    <span class="eyebrow">Feedback</span>
    <h1>🔬 카드 오류 제보</h1>
    <p>카드 설명이나 기업 사례에 잘못된 정보, 오탈자, 오래된 내용이 있다면 알려주세요.</p>
  </div>
</section>
<section class="section-sm" style="padding-top:16px">
  <div class="container form-wrap">
    <form class="form-card" data-form="card-error" data-title="카드 오류 제보" novalidate>
      <div class="field" data-label="오류가 있는 카드 이름">
        <label for="b-subject">오류가 있는 카드 이름<span class="req">*</span></label>
        <input class="input" id="b-subject" name="subject" placeholder="예) Target · MZ세대" required>
        <p class="field-error">내용을 입력해주세요.</p>
      </div>
      <div class="field" data-label="오류 내용">
        <label for="b-body">오류 내용<span class="req">*</span></label>
        <textarea class="textarea" id="b-body" name="body" placeholder="어떤 부분이 잘못되었는지, 올바른 내용은 무엇인지 알려주세요." required></textarea>
        <p class="field-error">내용을 입력해주세요.</p>
      </div>
      <div class="field" data-label="회신 받을 이메일">
        <label for="b-email">회신 받을 이메일<span class="hint">답변이 필요하신 경우에만 입력해주세요.</span></label>
        <input class="input" id="b-email" name="email" type="email" autocomplete="email">
        <p class="field-error">올바른 이메일 주소를 입력해주세요.</p>
      </div>
      <div class="form-actions">
        <p class="muted"><span style="color:#dc2626">*</span> 필수 입력 항목</p>
        <button class="btn btn-primary" type="submit">제출하기</button>
      </div>
      <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
