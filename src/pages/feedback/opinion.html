---
title: 의견 남기기
description: 인벤션덱AI에 바라는 새로운 기능이나 개선 아이디어를 자유롭게 제안해주세요.
nav: feedback
---
<section class="page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="{{root}}feedback/index.html">피드백</a> › 의견 남기기</p>
    <span class="eyebrow">Feedback</span>
    <h1>📢 의견 남기기</h1>
    <p>인벤션덱AI에 바라는 새로운 기능이나 개선 아이디어를 자유롭게 제안해주세요.</p>
  </div>
</section>
<section class="section-sm" style="padding-top:16px">
  <div class="container form-wrap">
    <form class="form-card" data-form="opinion" data-title="의견 남기기" novalidate>
      <div class="field" data-label="제안 제목">
        <label for="b-subject">제안 제목<span class="req">*</span></label>
        <input class="input" id="b-subject" name="subject" placeholder="예) 팀원과 아이디어 공동 편집 기능" required>
        <p class="field-error">내용을 입력해주세요.</p>
      </div>
      <div class="field" data-label="제안 내용">
        <label for="b-body">제안 내용<span class="req">*</span></label>
        <textarea class="textarea" id="b-body" name="body" placeholder="어떤 상황에서 필요한 기능인지 구체적으로 알려주시면 큰 도움이 됩니다." required></textarea>
        <p class="field-error">내용을 입력해주세요.</p>
      </div>
      <div class="field" data-label="회신 받을 이메일">
        <label for="b-email">회신 받을 이메일<span class="hint">답변이 필요하신 경우에만 입력해주세요.</span></label>
        <input class="input" id="b-email" name="email" type="email" autocomplete="email">
        <p class="field-error">올바른 이메일 주소를 입력해주세요.</p>
      </div>
      <div class="form-actions">
        <p class="muted"><span style="color:#dc2626">*</span> 필수 입력 항목</p>
        <button class="btn btn-primary" type="submit">제출하기</button>
      </div>
      <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
