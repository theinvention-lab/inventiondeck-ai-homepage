---
title: 신규 카드 요청
description: 인벤션덱에 새로 추가되었으면 하는 카드(타겟, 기술, 트렌드, 수익모델 등)를 제안해주세요.
nav: feedback
---
<section class="page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="{{root}}feedback/index.html">피드백</a> › 신규 카드 요청</p>
    <span class="eyebrow">Feedback</span>
    <h1>🃏 신규 카드 요청</h1>
    <p>인벤션덱에 새로 추가되었으면 하는 카드(타겟, 기술, 트렌드, 수익모델 등)를 제안해주세요.</p>
  </div>
</section>
<section class="section-sm" style="padding-top:16px">
  <div class="container form-wrap">
    <form class="form-card" data-form="new-card" data-title="신규 카드 요청" novalidate>
      <div class="field" data-label="요청하는 카드 키워드">
        <label for="b-subject">요청하는 카드 키워드<span class="req">*</span></label>
        <input class="input" id="b-subject" name="subject" placeholder="예) 시니어 테크, 탄소배출권" required>
        <p class="field-error">내용을 입력해주세요.</p>
      </div>
      <div class="field" data-label="카드가 필요한 이유 / 참고 사례">
        <label for="b-body">카드가 필요한 이유 / 참고 사례<span class="req">*</span></label>
        <textarea class="textarea" id="b-body" name="body" placeholder="어떤 아이디어 발상에 도움이 될지, 참고할 만한 기업 사례가 있다면 함께 알려주세요." required></textarea>
        <p class="field-error">내용을 입력해주세요.</p>
      </div>
      <div class="field" data-label="회신 받을 이메일">
        <label for="b-email">회신 받을 이메일<span class="hint">답변이 필요하신 경우에만 입력해주세요.</span></label>
        <input class="input" id="b-email" name="email" type="email" autocomplete="email">
        <p class="field-error">올바른 이메일 주소를 입력해주세요.</p>
      </div>
      <div class="form-actions">
        <p class="muted"><span style="color:#dc2626">*</span> 필수 입력 항목</p>
        <button class="btn btn-primary" type="submit">제출하기</button>
      </div>
      <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
